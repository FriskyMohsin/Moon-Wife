<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Maryam Companion Bridge</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .badge-online { background: #065f46; color: #34d399; }
    .badge-offline { background: #7f1d1d; color: #f87171; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .input-field {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      margin: 6px 0 10px;
      background: #090d16;
      border: 1px solid #475569;
      color: #fff;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }
    button {
      width: 100%;
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #0369a1; }
    .status-text { font-size: 11px; color: #94a3b8; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>Maryam Browser Bridge</h2>
  <div id="host-badge" class="badge badge-offline">Host Disconnected</div>

  <div class="card" id="enrollment-status">
    <div id="account-info">Checking enrollment...</div>
  </div>

  <div class="card" id="pairing-box">
    <strong>Enroll Authorized Profile</strong>
    <p style="font-size: 11px; color: #94a3b8; margin: 4px 0 8px;">
      Paste the pairing code generated by Maryam Local Runner for this Chrome profile.
    </p>
    <select id="profile-role" class="input-field" style="height: 32px;">
      <option value="primary">Primary (friskymohsin31@gmail.com)</option>
      <option value="secondary">Secondary (undefine275@gmail.com)</option>
    </select>
    <input type="text" id="pairing-code" class="input-field" placeholder="Enter pairing secret token..." />
    <button id="submit-pairing">Verify & Pair Profile</button>
    <div id="pairing-result" class="status-text"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
